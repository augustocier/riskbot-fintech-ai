services:
  - type: web
    name: riskbot-fintech-ai
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DEFAULT_MODEL
        value: gemini-3.5-flash-lite
      - key: ALLOWED_MODELS
        value: gemini-3.5-flash-lite
      - key: JUDGE_MODEL
        value: gemini-3.5-flash-lite
